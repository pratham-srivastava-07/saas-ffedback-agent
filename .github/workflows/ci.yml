name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The suite runs entirely on fake providers, so CI needs no secrets and
      # makes no network calls.
      - name: Run tests
        run: pytest -q

      - name: Verify the demo corpus seeds end to end
        run: python scripts/seed_demo.py --offline --reset --database /tmp/ci-demo.db
